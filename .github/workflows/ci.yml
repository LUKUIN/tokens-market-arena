name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Test matrix, not a runtime requirement. **The runtime is pinned to Python 3.14.7** (see AGENTS.md).
        # These two deliberately non-3.14 entries verify that run.py's version guard actually blocks them.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Version guard (non-3.14 must exit with code 2)
        shell: bash
        run: |
          set +e
          python run.py state > /dev/null 2>&1
          rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::version guard broken: expected exit code 2, got $rc"
            exit 1
          fi
          echo "version guard OK (exit code 2)"

      - name: Syntax check
        run: python -m py_compile run.py src/tm_engine.py src/tm_api.py src/tm_watch_ai.py src/scratchpad.py

      - name: Engine smoke test (temp dir, repo untouched)
        shell: python
        run: |
          import sys, tempfile
          sys.path.insert(0, "src")
          import tm_engine

          home = tempfile.mkdtemp()
          eng = tm_engine.Engine(home)
          st = eng.state()

          assert abs(st["equity"] - 1_000_000.0) < 1e-6, st["equity"]
          assert len(st["prices"]) == 7, len(st["prices"])
          assert st["target"] == 2_000_000.0, st["target"]
          print("equity =", st["equity"])
          print("tick   =", st["tick"])
          print("pairs  =", len(st["prices"]))

      - name: Trimmed state carries no history
        shell: python
        run: |
          import sys, tempfile
          sys.path.insert(0, "src")
          import tm_engine

          home = tempfile.mkdtemp()
          eng = tm_engine.Engine(home)
          light = eng.state(include_history=False, include_events=False)
          assert light["price_history"] == {}, "trimmed state must not carry history"
          assert light["events"] == [], "trimmed state must not carry the event feed"
          assert light["equity"] == eng.state()["equity"]
          print("light state OK")

      - name: Settlement and cost-model invariant tests
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Guard against committing the signing key
        shell: bash
        run: |
          if grep -rn "guard::a8f3c1e7" src/ run.py; then
            echo "::error::the packaged build's hard-coded signing key must never land in this repo"
            exit 1
          fi
          echo "no hard-coded key found"
