name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 测试矩阵，不是运行要求。**运行时固定 Python 3.14.7**，见 AGENTS.md。
        # 这里刻意选两个非 3.14 的版本，用来验证 run.py 的版本守卫确实会拦下来。
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 版本守卫（非 3.14 必须退出码 2）
        shell: bash
        run: |
          set +e
          python run.py state > /dev/null 2>&1
          rc=$?
          echo "guard exit code: $rc"
          if [ "$rc" -ne 2 ]; then
            echo "::error::版本守卫失效：期望退出码 2，实际 $rc"
            exit 1
          fi
          echo "版本守卫 OK（退出码 2）"

      - name: 语法检查
        run: python -m py_compile run.py src/tm_engine.py src/tm_api.py src/tm_watch_ai.py src/scratchpad.py

      - name: 引擎冒烟（临时目录，不碰仓库）
        shell: python
        run: |
          import sys, tempfile
          sys.path.insert(0, "src")
          import tm_engine

          home = tempfile.mkdtemp()
          eng = tm_engine.Engine(home)
          st = eng.state()

          assert abs(st["equity"] - 1_000_000.0) < 1e-6, st["equity"]
          assert len(st["prices"]) == 7, len(st["prices"])
          assert st["target"] == 2_000_000.0, st["target"]
          print("equity =", st["equity"])
          print("tick   =", st["tick"])
          print("pairs  =", len(st["prices"]))

      - name: 结算与成本模型不变量测试
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: 精简体（?history 参数）不带历史
        shell: python
        run: |
          import sys, tempfile
          sys.path.insert(0, "src")
          import tm_engine

          home = tempfile.mkdtemp()
          eng = tm_engine.Engine(home)
          light = eng.state(include_history=False, include_events=False)
          assert light["price_history"] == {}, "精简状态不该带历史"
          assert light["events"] == [], "精简状态不该带事件流"
          assert light["equity"] == eng.state()["equity"]
          print("light state OK")

      - name: 防误提交签名密钥
        shell: bash
        run: |
          if grep -rn "guard::a8f3c1e7" src/ run.py; then
            echo "::error::发现成品包的硬编码签名密钥，开源仓库不能包含"
            exit 1
          fi
          echo "未发现硬编码密钥"
