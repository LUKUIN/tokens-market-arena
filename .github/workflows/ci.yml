name: CI

on:
  push:
    # main holds the Chinese edition, english holds this one; both must run CI
    branches: [main, english]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Test matrix, not a runtime requirement. **The runtime is Python 3.14**
        # (see AGENTS.md). 3.11 / 3.13 exist to prove run.py's version guard
        # rejects them; 3.14 is the only supported runtime and must pass the
        # whole suite (added in v1.2.13).
        python: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Version guard (non-3.14 rejected, 3.14 allowed)
        shell: bash
        run: |
          set +e
          python run.py state > /dev/null 2>&1
          rc=$?
          echo "guard exit code: $rc"
          if [ "${{ matrix.python }}" = "3.14" ]; then
            # Stricter than before: not merely "not rejected" but a clean exit.
            # The old check only asserted rc != 2, so a crash (rc=1) slipped through.
            if [ "$rc" -ne 0 ]; then
              echo "::error::the only supported runtime must run 'run.py state' cleanly; got exit code $rc"
              exit 1
            fi
            echo "guard allows 3.14 and the command exits cleanly (rc=0)"
          else
            if [ "$rc" -ne 2 ]; then
              echo "::error::version guard broken: expected exit code 2, got $rc"
              exit 1
            fi
            echo "guard OK: non-3.14 rejected (exit code 2)"
          fi

      - name: Syntax check
        run: python -m py_compile run.py bench.py src/tm_engine.py src/tm_api.py src/tm_watch_ai.py src/scratchpad.py

      - name: Engine smoke test (temp dir, repo untouched)
        shell: python
        run: |
          import sys, tempfile
          sys.path.insert(0, "src")
          import tm_engine

          home = tempfile.mkdtemp()
          eng = tm_engine.Engine(home)
          st = eng.state()

          assert abs(st["equity"] - 1_000_000.0) < 1e-6, st["equity"]
          assert len(st["prices"]) == 7, len(st["prices"])
          assert st["target"] == 2_000_000.0, st["target"]
          print("equity =", st["equity"])
          print("tick   =", st["tick"])
          print("pairs  =", len(st["prices"]))

      - name: Trimmed state carries no history
        shell: python
        run: |
          import sys, tempfile
          sys.path.insert(0, "src")
          import tm_engine

          home = tempfile.mkdtemp()
          eng = tm_engine.Engine(home)
          light = eng.state(include_history=False, include_events=False)
          assert light["price_history"] == {}, "trimmed state must not carry history"
          assert light["events"] == [], "trimmed state must not carry the event feed"
          assert light["equity"] == eng.state()["equity"]
          print("light state OK")

      - name: Settlement and cost-model invariant tests
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Paired-benchmark smoke (one seed, repo untouched)
        shell: bash
        run: python bench.py run --seeds 1 --policy noop --out "$RUNNER_TEMP/tmbench"

      - name: Guard against committing the signing key
        shell: bash
        run: |
          if grep -rn "guard::a8f3c1e7" src/ run.py; then
            echo "::error::the packaged build's hard-coded signing key must never land in this repo"
            exit 1
          fi
          echo "no hard-coded key found"
